# Liquibase master changelog. Each schema change is a changeset included
# here (GUIDELINES.md section 8.1).
databaseChangeLog:
  - include:
      file: changes/create-categories.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/create-products.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/create-stock-batches.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/create-users-and-roles.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/create-suppliers.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/create-stock-alerts.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/create-discounts.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/seed-discounts.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/create-sales.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/create-customers.yaml
      relativeToChangelogFile: true
  # Sample data, loaded only with LIQUIBASE_CONTEXTS=demo (.env.example). Keep it last.
  - include:
      file: changes/seed-demo-data.yaml
      relativeToChangelogFile: true
