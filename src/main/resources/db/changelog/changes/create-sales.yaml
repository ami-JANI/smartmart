# A completed cash sale (FR-POS-9, FR-POS-10). The sale row is the invoice;
# its number is formed from the id. Lines keep the price as sold, and the
# payment row records the cash taken and the change given.
databaseChangeLog:
  - changeSet:
      id: create-sales
      author: smartmart
      changes:
        - createTable:
            tableName: sales
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sales
              - column:
                  name: cashier_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sales_cashier
                    references: users(id)
              - column:
                  name: discount_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_sales_discount
                    references: discounts(id)
              - column:
                  name: sold_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: discount_amount
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: vat_included
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createTable:
            tableName: sale_lines
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sale_lines
              - column:
                  name: sale_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sale_lines_sale
                    references: sales(id)
                    deleteCascade: true
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sale_lines_product
                    references: products(id)
              - column:
                  name: quantity
                  type: numeric(12,3)
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: line_total
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: sale_lines
            indexName: ix_sale_lines_sale
            columns:
              - column:
                  name: sale_id
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payments
              - column:
                  name: sale_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_payments_sale
                    foreignKeyName: fk_payments_sale
                    references: sales(id)
                    deleteCascade: true
              - column:
                  name: method
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: cash_received
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: change_due
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        # Money is never negative, and cash covers the amount (FR-POS-9).
        - sql:
            sql: >
              ALTER TABLE sales
                ADD CONSTRAINT ck_sales_amounts CHECK (subtotal >= 0 AND discount_amount >= 0
                  AND discount_amount <= subtotal AND total = subtotal - discount_amount AND vat_included >= 0);
              ALTER TABLE sale_lines
                ADD CONSTRAINT ck_sale_lines_quantity CHECK (quantity > 0);
              ALTER TABLE payments
                ADD CONSTRAINT ck_payments_cash CHECK (amount >= 0 AND cash_received >= amount
                  AND change_due = cash_received - amount)
