databaseChangeLog:
  - changeSet:
      id: create-stock-batches
      author: smartmart
      changes:
        - createTable:
            tableName: stock_batches
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_stock_batches
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_stock_batches_product
                    references: products(id)
              - column:
                  name: batch_number
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: numeric(12,3)
                  constraints:
                    nullable: false
              - column:
                  name: cost
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: date
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: stock_batches
            indexName: ix_stock_batches_product
            columns:
              - column:
                  name: product_id
        # Stock can never go negative (GUIDELINES.md section 8.1).
        - sql:
            sql: >
              ALTER TABLE stock_batches ADD CONSTRAINT ck_stock_batches_quantity
              CHECK (quantity >= 0)
