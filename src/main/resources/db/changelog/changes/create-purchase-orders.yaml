databaseChangeLog:
  - changeSet:
      id: create-purchase-orders
      author: smartmart
      changes:
        - createTable:
            tableName: purchase_orders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_purchase_orders
              - column:
                  name: supplier_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_purchase_orders_supplier
                    references: suppliers(id)
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: purchase_orders
            indexName: ix_purchase_orders_supplier
            columns:
              - column:
                  name: supplier_id
        - createIndex:
            tableName: purchase_orders
            indexName: ix_purchase_orders_status
            columns:
              - column:
                  name: status
        - sql:
            sql: >
              ALTER TABLE purchase_orders ADD CONSTRAINT ck_purchase_orders_status
              CHECK (status IN ('DRAFT', 'SUBMITTED', 'PARTIALLY_RECEIVED', 'RECEIVED', 'CLOSED', 'CANCELLED'))
        - createTable:
            tableName: purchase_order_lines
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_purchase_order_lines
              - column:
                  name: purchase_order_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_purchase_order_lines_order
                    references: purchase_orders(id)
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_purchase_order_lines_product
                    references: products(id)
              - column:
                  name: quantity
                  type: numeric(12,3)
                  constraints:
                    nullable: false
              - column:
                  name: unit_cost
                  type: numeric(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: received_quantity
                  type: numeric(12,3)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: purchase_order_lines
            constraintName: uq_purchase_order_lines_product
            columnNames: purchase_order_id, product_id
        # A line never receives more than was ordered (FR-PUR-6).
        - sql:
            sql: >
              ALTER TABLE purchase_order_lines ADD CONSTRAINT ck_purchase_order_lines_amounts
              CHECK (quantity > 0 AND unit_cost >= 0
                     AND received_quantity >= 0 AND received_quantity <= quantity)
