databaseChangeLog:
  - changeSet:
      id: create-suppliers
      author: smartmart
      changes:
        - createTable:
            tableName: suppliers
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_suppliers
              - column:
                  name: name
                  type: varchar(120)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_suppliers_name
              - column:
                  name: contact_person
                  type: varchar(100)
              - column:
                  name: phone
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(120)
              - column:
                  name: address
                  type: varchar(255)
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
