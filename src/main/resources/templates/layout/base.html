<!DOCTYPE html>
<!--/*
  Shared page layout (SCRUM-38). Every page uses it:

    <html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
    <head><title>Page name</title></head>
    <body><main>...page content...</main></body>
    </html>

  Model attributes read here (all optional):
    username  name of the logged-in user; the nav and logout button show only when set
    roles     collection of role names of the logged-in user, without a ROLE_ prefix:
              ADMIN, MANAGER, CASHIER, INVENTORY_STAFF. A menu item shows only when
              the user holds a role allowed to open it (GUIDELINES.md section 7).
              The menu only hides links; the server still denies the pages (SCRUM-20).
    activeNav name of the current menu item (users, categories, products, suppliers, alerts, pos), optional
    storeName store name for the header and footer; defaults to "SmartMart"
    openAlertCount  number of open stock alerts for INVENTORY_STAFF and MANAGER, shown as a badge
              on the Alerts menu item when above 0; null for other roles (AlertModelAdvice, SCRUM-53)
*/-->
<html lang="en" th:fragment="layout(title, content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">SmartMart</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
    <div class="container header-bar">
        <a class="brand" th:href="@{/}" href="/" th:text="${storeName != null} ? ${storeName} : 'SmartMart'">SmartMart</a>

        <th:block th:if="${username != null}">
            <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Show menu">
            <label for="nav-toggle" class="nav-toggle" aria-hidden="true">Menu</label>
        </th:block>

        <nav class="site-nav" aria-label="Main" th:if="${username != null}">
            <ul>
                <li><a th:href="@{/}" href="/">Home</a></li>
                <li th:if="${roles != null and roles.contains('ADMIN')}">
                    <a th:href="@{/users}" href="/users" th:attr="aria-current=${activeNav == 'users'} ? 'page'">Users</a>
                </li>
                <li th:if="${roles != null and roles.contains('INVENTORY_STAFF')}">
                    <a th:href="@{/categories}" href="/categories" th:attr="aria-current=${activeNav == 'categories'} ? 'page'">Categories</a>
                </li>
                <li th:if="${roles != null and (roles.contains('INVENTORY_STAFF') or roles.contains('MANAGER'))}">
                    <a th:href="@{/products}" href="/products" th:attr="aria-current=${activeNav == 'products'} ? 'page'">Products</a>
                </li>
                <li th:if="${roles != null and roles.contains('INVENTORY_STAFF')}">
                    <a th:href="@{/suppliers}" href="/suppliers" th:attr="aria-current=${activeNav == 'suppliers'} ? 'page'">Suppliers</a>
                </li>
                <li th:if="${roles != null and (roles.contains('INVENTORY_STAFF') or roles.contains('MANAGER'))}">
                    <a th:href="@{/alerts}" href="/alerts" th:attr="aria-current=${activeNav == 'alerts'} ? 'page'">Alerts<span
                            class="badge badge-warn nav-badge" th:if="${openAlertCount != null and openAlertCount > 0}"><span
                            th:text="${openAlertCount}">3</span><span class="visually-hidden"> open</span></span></a>
                </li>
                <li th:if="${roles != null and roles.contains('CASHIER')}">
                    <a th:href="@{/pos}" href="/pos" th:attr="aria-current=${activeNav == 'pos'} ? 'page'">Point of sale</a>
                </li>
            </ul>
            <div class="nav-user">
                <span class="nav-username" th:text="${username}">user</span>
                <form th:action="@{/logout}" action="/logout" method="post">
                    <button type="submit" class="btn btn-secondary btn-small">Log out</button>
                </form>
            </div>
        </nav>
    </div>
</header>

<main id="main-content" class="container" th:replace="${content}">
    <p>Page content goes here.</p>
</main>

<footer class="site-footer">
    <div class="container">
        <span th:text="${storeName != null} ? ${storeName} : 'SmartMart'">SmartMart</span>
        &middot; Super shop management system
    </div>
</footer>
</body>
</html>
