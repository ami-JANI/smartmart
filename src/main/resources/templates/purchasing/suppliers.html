<!DOCTYPE html>
<!--/*
  Supplier list (SCRUM-35). Inventory staff.

  Model attributes
    page       one page of suppliers, like Spring Data's Page: content (id, name, contactPerson,
               phone, email, active), number (0-based), size, totalPages, totalElements, first, last
    q          the text searched for, or null
    message    optional success text
    activeNav  "suppliers"
  Request
    GET /suppliers?q=acme&page=0&size=20
    q matches part of the name, contact person or phone (FR-PUR-2).
*/-->
<html lang="en" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Suppliers - SmartMart</title>
</head>
<body>
<main id="main-content" class="container" th:with="qParam=${q != null} ? ${q} : ''">
    <div class="page-header">
        <h1>Suppliers</h1>
        <a class="btn btn-primary" th:href="@{/suppliers/new}" href="/suppliers/new">New supplier</a>
    </div>

    <p class="alert alert-success" role="status" th:if="${message}" th:text="${message}">Saved.</p>

    <form th:action="@{/suppliers}" method="get" class="toolbar">
        <span class="toolbar-field">
            <label for="q">Search</label>
            <input type="search" id="q" name="q" th:value="${q}" maxlength="120" autocomplete="off"
                   placeholder="Name, contact or phone">
        </span>
        <input type="hidden" name="size" th:value="${page.size}">
        <button type="submit" class="btn btn-secondary btn-small">Search</button>
    </form>

    <div class="table-wrap">
        <table class="table">
            <caption th:text="${page.totalElements} + (${page.totalElements == 1} ? ' supplier' : ' suppliers')">0 suppliers</caption>
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Contact person</th>
                <th scope="col">Phone</th>
                <th scope="col">Email</th>
                <th scope="col">Status</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="supplier : ${page.content}">
                <td th:text="${supplier.name}">Supplier</td>
                <td th:text="${supplier.contactPerson}">Contact</td>
                <td th:text="${supplier.phone}">01700000000</td>
                <td th:text="${supplier.email}">name@example.com</td>
                <td>
                    <span class="badge badge-ok" th:if="${supplier.active}">Active</span>
                    <span class="badge badge-off" th:unless="${supplier.active}">Inactive</span>
                </td>
                <td class="actions">
                    <a class="btn btn-secondary btn-small" th:href="@{/suppliers/{id}/edit(id=${supplier.id})}"
                       href="#">Edit<span class="visually-hidden"> <span th:text="${supplier.name}"></span></span></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(page.content)}">
                <td colspan="6" class="table-empty">No suppliers found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="pager" aria-label="Pages" th:if="${page.totalPages > 1}">
        <a class="btn btn-secondary btn-small" th:unless="${page.first}"
           th:href="@{/suppliers(q=${qParam}, size=${page.size}, page=${page.number - 1})}">Previous</a>
        <span class="pager-status" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page 1 of 3</span>
        <a class="btn btn-secondary btn-small" th:unless="${page.last}"
           th:href="@{/suppliers(q=${qParam}, size=${page.size}, page=${page.number + 1})}">Next</a>
    </nav>
</main>
</body>
</html>
