<!DOCTYPE html>
<!--/*
  Supplier form, create and edit (SCRUM-35). Inventory staff.

  Model attributes
    supplierForm  form object: name, contactPerson, phone, email, address, active
                  (true for a new supplier), bound with BindingResult
    editing       true when editing an existing supplier
    supplierId    id of the supplier being edited (only when editing)
    activeNav     "suppliers"
  Requests
    POST /suppliers        create
    POST /suppliers/{id}   update
  A taken name comes back as a field error on "name" and shows under the name field.
*/-->
<html lang="en" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Supplier - SmartMart</title>
</head>
<body>
<main id="main-content" class="container">
    <div class="page-header">
        <h1 th:text="${editing} ? 'Edit supplier' : 'New supplier'">New supplier</h1>
    </div>

    <section class="card form-narrow">
        <form th:action="${editing} ? @{/suppliers/{id}(id=${supplierId})} : @{/suppliers}" th:object="${supplierForm}"
              action="/suppliers" method="post" class="form" novalidate>

            <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" maxlength="120" required
                       th:attrappend="aria-describedby=${#fields.hasErrors('name')} ? 'name-error'">
                <p class="field-error" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('contactPerson')} ? 'has-error'">
                <label for="contactPerson">Contact person</label>
                <input type="text" id="contactPerson" th:field="*{contactPerson}" maxlength="100"
                       th:attrappend="aria-describedby=${#fields.hasErrors('contactPerson')} ? 'contactPerson-error'">
                <p class="hint">Optional.</p>
                <p class="field-error" id="contactPerson-error" th:if="${#fields.hasErrors('contactPerson')}" th:errors="*{contactPerson}">Error</p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('phone')} ? 'has-error'">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" th:field="*{phone}" minlength="6" maxlength="20" required
                       th:attrappend="aria-describedby=${#fields.hasErrors('phone')} ? 'phone-error'">
                <p class="field-error" id="phone-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Error</p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" maxlength="120" autocomplete="off"
                       th:attrappend="aria-describedby=${#fields.hasErrors('email')} ? 'email-error'">
                <p class="hint">Optional.</p>
                <p class="field-error" id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('address')} ? 'has-error'">
                <label for="address">Address</label>
                <input type="text" id="address" th:field="*{address}" maxlength="255"
                       th:attrappend="aria-describedby=${#fields.hasErrors('address')} ? 'address-error'">
                <p class="hint">Optional.</p>
                <p class="field-error" id="address-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Error</p>
            </div>

            <ul class="check-list">
                <li>
                    <label>
                        <input type="checkbox" th:field="*{active}">
                        <span>Active</span>
                    </label>
                </li>
            </ul>
            <p class="hint">Purchase orders can only be raised against active suppliers.</p>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Save changes' : 'Create supplier'">Save</button>
                <a class="btn btn-secondary" th:href="@{/suppliers}" href="/suppliers">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
