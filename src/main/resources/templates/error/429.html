<!DOCTYPE html>
<!--/*
  429: too many failed logins for this username from this computer (FR-AUTH-8, SCRUM-56).
  Reads: retryAfterSeconds, the wait in whole seconds, the same number as the Retry-After
  header. The filter sets it as a request attribute; without it the page says "about a minute".
  The text is the same whether or not the username exists.
*/-->
<html lang="en" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Too many attempts - SmartMart</title>
</head>
<body>
<main id="main-content" class="container">
    <section class="card message-card">
        <p class="message-code" aria-hidden="true">429</p>
        <h1>Too many failed logins</h1>
        <p th:if="${retryAfterSeconds != null}">
            Logging in with this username is paused. Try again in
            <strong th:text="${retryAfterSeconds} + (${retryAfterSeconds == 1} ? ' second' : ' seconds')">60 seconds</strong>.
        </p>
        <p th:unless="${retryAfterSeconds != null}">
            Logging in with this username is paused. Try again in about a minute.
        </p>
        <a class="btn btn-primary" th:href="@{/login}" href="/login">Back to log in</a>
    </section>
</main>
</body>
</html>
