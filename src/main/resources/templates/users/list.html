<!DOCTYPE html>
<!--/*
  User list (SCRUM-40). Administrator only.

  Model attributes
    users      list of users: id, username, fullName, roles (list of role names), active (boolean)
    message    optional success text
    error      optional error text, for example "You cannot deactivate your own account"
    activeNav  "users"
  Requests
    GET  /users/new, GET /users/{id}/edit   the user form
    POST /users/{id}/deactivate             deactivated users cannot log in
*/-->
<html lang="en" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users - SmartMart</title>
</head>
<body>
<main id="main-content" class="container">
    <div class="page-header">
        <h1>Users</h1>
        <a class="btn btn-primary" th:href="@{/users/new}" href="/users/new">New user</a>
    </div>

    <p class="alert alert-success" role="status" th:if="${message}" th:text="${message}">Saved.</p>
    <p class="alert alert-error" role="alert" th:if="${error}" th:text="${error}">Could not save.</p>

    <div class="table-wrap">
        <table class="table table-stack">
            <thead>
            <tr>
                <th scope="col">Username</th>
                <th scope="col">Full name</th>
                <th scope="col">Roles</th>
                <th scope="col">Status</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td data-label="Username" th:text="${user.username}">cashier1</td>
                <td data-label="Full name" th:text="${user.fullName}">Full Name</td>
                <td data-label="Roles">
                    <span class="badge" th:each="role : ${user.roles}"
                          th:text="${#strings.replace(#strings.capitalize(#strings.toLowerCase(role)), '_', ' ')}">Role</span>
                    <span class="muted" th:if="${#lists.isEmpty(user.roles)}">None</span>
                </td>
                <td data-label="Status">
                    <span class="badge badge-ok" th:if="${user.active}">Active</span>
                    <span class="badge badge-off" th:unless="${user.active}">Deactivated</span>
                </td>
                <td data-label="" class="actions">
                    <a class="btn btn-secondary btn-small" th:href="@{/users/{id}/edit(id=${user.id})}"
                       href="#">Edit<span class="visually-hidden"> <span th:text="${user.username}"></span></span></a>
                    <form th:if="${user.active}" th:action="@{/users/{id}/deactivate(id=${user.id})}" method="post"
                          onsubmit="return confirm('Deactivate this user? They will no longer be able to log in.');">
                        <button type="submit" class="btn btn-secondary btn-small">Deactivate<span class="visually-hidden"> <span th:text="${user.username}"></span></span></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="5" class="table-empty">No users yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
