<!DOCTYPE html>
<!--/*
  Inventory alerts list (SCRUM-34, SCRUM-53).
  Visible to INVENTORY_STAFF and MANAGER.

  Model attributes:
    alerts    list of AlertView records, newest raisedAt first: id, type (LOW_STOCK or NEAR_EXPIRY),
              productId, productName, raisedAt (Instant); LOW_STOCK adds totalStock and threshold,
              NEAR_EXPIRY adds batchNumber, quantity and expiryDate (LocalDate)
    activeNav "alerts"
  The open alert count for the menu badge comes from AlertModelAdvice (layout/base.html).
  Quantities are shown without trailing zeros, since AlertView has no sale unit.
*/-->
<html lang="en" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Stock alerts - SmartMart</title>
</head>
<body>
<main id="main-content" class="container">
    <div class="page-header">
        <h1>Stock alerts</h1>
    </div>

    <div class="table-wrap">
        <table class="table">
            <caption th:with="count=${alerts == null ? 0 : alerts.size()}"
                     th:text="${count} + (${count == 1} ? ' open alert' : ' open alerts')">0 open alerts</caption>
            <thead>
            <tr>
                <th scope="col">Type</th>
                <th scope="col">Product</th>
                <th scope="col">Details</th>
                <th scope="col">Raised</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="alert : ${alerts}" th:with="lowStock=${alert.type.name() == 'LOW_STOCK'}">
                <td>
                    <span class="badge badge-warn" th:if="${lowStock}">Low stock</span>
                    <span class="badge badge-bad" th:unless="${lowStock}">Near expiry</span>
                </td>
                <td>
                    <a th:href="@{/products/{id}(id=${alert.productId})}" href="#" th:text="${alert.productName}">Product</a>
                </td>
                <td>
                    <span th:if="${lowStock}">
                        In stock <strong th:text="${alert.totalStock.stripTrailingZeros().toPlainString()}">3</strong>,
                        threshold <span th:text="${alert.threshold.stripTrailingZeros().toPlainString()}">10</span>
                    </span>
                    <span th:unless="${lowStock}">
                        Batch <strong th:text="${alert.batchNumber}">B-1</strong>:
                        <span th:text="${alert.quantity.stripTrailingZeros().toPlainString()}">5</span> left,
                        expires <strong th:text="${#temporals.format(alert.expiryDate, 'dd MMM yyyy')}">15 Nov 2026</strong>
                    </span>
                </td>
                <td th:text="${#temporals.format(alert.raisedAt, 'dd MMM yyyy, HH:mm')}">10 Nov 2026, 12:00</td>
            </tr>
            <tr th:if="${alerts == null or alerts.isEmpty()}">
                <td colspan="4" class="table-empty">No open alerts. Stock levels and expiry dates are fine.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
