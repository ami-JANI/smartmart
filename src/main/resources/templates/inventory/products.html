<!DOCTYPE html>
<!--/*
  Product list (SCRUM-42). Inventory staff edit; managers can view.

  Model attributes
    page            one page of products, like Spring Data's Page:
                    content (id, name, barcode, categoryName, price, saleUnit PIECE or KG,
                    totalStock, lowStock), number (0-based), size, totalPages, totalElements, first, last
    categories      flat list for the filter: id, path (for example "Food > Rice")
    selectedCategory id of the chosen category, or null for all
    q               the name or barcode text searched for, or null
    lowStockOnly    true when only low-stock products are shown
    sortField       name, barcode or price
    sortDir         asc or desc
    message         optional success text
    roles           the global roles attribute (layout/base.html); only INVENTORY_STAFF see New and Edit
    activeNav       "products"
  Request
    GET /products?q=rice&category=12&lowStock=true&sort=name,asc&page=0&size=20
    q matches part of the name or barcode. Empty q, category or lowStock values mean "no filter".
    Without a size the server uses 20 per page (FR-INV-4).
*/-->
<html lang="en" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products - SmartMart</title>
</head>
<body>
<main id="main-content" class="container"
      th:with="catParam=${selectedCategory != null} ? ${selectedCategory} : '',
               qParam=${q != null} ? ${q} : '',
               lowParam=${lowStockOnly} ? 'true' : ''">
    <div class="page-header">
        <h1>Products</h1>
        <a class="btn btn-primary" th:href="@{/products/new}" href="/products/new"
           th:if="${roles != null and roles.contains('INVENTORY_STAFF')}">New product</a>
    </div>

    <p class="alert alert-success" role="status" th:if="${message}" th:text="${message}">Saved.</p>

    <form th:action="@{/products}" method="get" class="toolbar">
        <label for="q">Search</label>
        <input type="search" id="q" name="q" th:value="${q}" maxlength="120" autocomplete="off"
               placeholder="Name or barcode">
        <label for="category">Category</label>
        <select id="category" name="category">
            <option value="">All categories</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.path}"
                    th:selected="${selectedCategory != null and c.id == selectedCategory}">Category</option>
        </select>
        <label class="toolbar-check">
            <input type="checkbox" name="lowStock" value="true" th:checked="${lowStockOnly}"> Low stock only
        </label>
        <input type="hidden" name="sort" th:value="${sortField + ',' + sortDir}">
        <input type="hidden" name="size" th:value="${page.size}">
        <button type="submit" class="btn btn-secondary btn-small">Filter</button>
    </form>

    <div class="table-wrap">
        <table class="table">
            <caption th:text="${page.totalElements} + (${page.totalElements == 1} ? ' product' : ' products')">0 products</caption>
            <thead>
            <tr>
                <th scope="col" th:aria-sort="${sortField == 'name'} ? (${sortDir == 'asc'} ? 'ascending' : 'descending') : 'none'">
                    <a th:href="@{/products(q=${qParam}, category=${catParam}, lowStock=${lowParam}, sort=${'name,' + (sortField == 'name' and sortDir == 'asc' ? 'desc' : 'asc')}, size=${page.size}, page=0)}"
                       class="sort-link">Name</a>
                </th>
                <th scope="col" th:aria-sort="${sortField == 'barcode'} ? (${sortDir == 'asc'} ? 'ascending' : 'descending') : 'none'">
                    <a th:href="@{/products(q=${qParam}, category=${catParam}, lowStock=${lowParam}, sort=${'barcode,' + (sortField == 'barcode' and sortDir == 'asc' ? 'desc' : 'asc')}, size=${page.size}, page=0)}"
                       class="sort-link">Barcode</a>
                </th>
                <th scope="col">Category</th>
                <th scope="col" class="num" th:aria-sort="${sortField == 'price'} ? (${sortDir == 'asc'} ? 'ascending' : 'descending') : 'none'">
                    <a th:href="@{/products(q=${qParam}, category=${catParam}, lowStock=${lowParam}, sort=${'price,' + (sortField == 'price' and sortDir == 'asc' ? 'desc' : 'asc')}, size=${page.size}, page=0)}"
                       class="sort-link">Price</a>
                </th>
                <th scope="col" class="num">In stock</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${page.content}">
                <td><a th:href="@{/products/{id}(id=${p.id})}" href="#" th:text="${p.name}">Product</a></td>
                <td th:text="${p.barcode}">0000000000000</td>
                <td th:text="${p.categoryName}">Category</td>
                <td class="num">
                    <span th:text="'৳ ' + ${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">৳ 0.00</span>
                    <span class="muted" th:text="${p.saleUnit == 'KG'} ? '/ kg' : '/ piece'">/ piece</span>
                </td>
                <td class="num">
                    <span th:text="${#numbers.formatDecimal(p.totalStock, 1, 'COMMA', p.saleUnit == 'KG' ? 3 : 0, 'POINT')}">0</span>
                    <span class="badge badge-warn" th:if="${p.lowStock}">Low</span>
                </td>
                <td class="actions">
                    <a class="btn btn-secondary btn-small" th:href="@{/products/{id}/edit(id=${p.id})}" href="#"
                       th:if="${roles != null and roles.contains('INVENTORY_STAFF')}">Edit<span class="visually-hidden"> <span th:text="${p.name}"></span></span></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(page.content)}">
                <td colspan="6" class="table-empty">No products found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="pager" aria-label="Pages" th:if="${page.totalPages > 1}">
        <a class="btn btn-secondary btn-small" th:unless="${page.first}"
           th:href="@{/products(q=${qParam}, category=${catParam}, lowStock=${lowParam}, sort=${sortField + ',' + sortDir}, size=${page.size}, page=${page.number - 1})}">Previous</a>
        <span class="pager-status" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page 1 of 3</span>
        <a class="btn btn-secondary btn-small" th:unless="${page.last}"
           th:href="@{/products(q=${qParam}, category=${catParam}, lowStock=${lowParam}, sort=${sortField + ',' + sortDir}, size=${page.size}, page=${page.number + 1})}">Next</a>
    </nav>
</main>
</body>
</html>
