<!DOCTYPE html>
<!--/*
  Money formatting shared by the POS pages: BDT with 2 decimals.
  Use: <span th:replace="~{fragments/money :: amount(${cart.total})}">৳ 0.00</span>
*/-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<span th:fragment="amount(value)" th:text="'৳ ' + ${#numbers.formatDecimal(value, 1, 'COMMA', 2, 'POINT')}">৳ 0.00</span>
</body>
</html>
