# Settings come from environment variables, or from .env during local
# development (copy .env.example to .env). See GUIDELINES.md section 7.
spring:
  application:
    name: SmartMart
  config:
    import: optional:file:.env[.properties]
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Two PostgreSQL servers (GUIDELINES.md section 8.2). Read-only
# transactions use the replica; everything else uses the primary.
smartmart:
  store:
    low-stock-default: 10
  datasource:
    primary:
      pool-name: primary
      jdbc-url: ${DB_PRIMARY_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
    replica:
      pool-name: replica
      jdbc-url: ${DB_REPLICA_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
