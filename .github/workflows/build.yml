name: Build

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The tests need the primary and the replica from compose.yaml.
      - name: Start the databases
        run: |
          cp .env.example .env
          docker compose up -d --wait db-primary
          docker compose up -d db-replica
          for i in $(seq 1 30); do
            docker compose exec -T db-replica pg_isready && exit 0
            sleep 2
          done
          docker compose logs db-replica
          exit 1

      - name: Build and test
        run: ./mvnw -B verify
