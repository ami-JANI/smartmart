name: Commit messages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every new commit against COMMIT.md
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER -1"
          else
            range="$BEFORE..$AFTER"
          fi
          status=0
          for sha in $(git rev-list --no-merges $range); do
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! sh .githooks/commit-msg /tmp/msg; then
              echo "::error::Commit $(git rev-parse --short "$sha") does not follow COMMIT.md"
              status=1
            fi
          done
          exit $status
