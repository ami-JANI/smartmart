# SmartMart: the Spring Boot application and two PostgreSQL servers, a
# primary (read-write) and a streaming replica (read-only). See
# GUIDELINES.md section 8.2.
#
#   cp .env.example .env   # then set real passwords
#   docker compose up -d --build
#
# The application is then at http://localhost:8080, Prometheus at
# http://localhost:9090 and Grafana at http://localhost:3000 (SCRUM-60,
# SCRUM-61). To run only the monitoring next to an application started on the
# host: docker compose up -d prometheus grafana

services:
  db-primary:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./db/primary/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  db-replica:
    image: postgres:16
    user: postgres
    depends_on:
      db-primary:
        condition: service_healthy
    environment:
      PRIMARY_HOST: db-primary
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./db/replica/start-replica.sh:/start-replica.sh:ro
    entrypoint: ["bash", "/start-replica.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # "demo" loads the sample shop data; without it, only the real schema.
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-none}
      # The store's local time, so sale and alert times are not shown in UTC.
      TZ: Asia/Dhaka
      # Inside Compose the servers are reached by service name, so these
      # replace the localhost URLs in .env, which are for running the
      # application on the host.
      DB_PRIMARY_URL: jdbc:postgresql://db-primary:5432/${DB_NAME}
      DB_REPLICA_URL: jdbc:postgresql://db-replica:5432/${DB_NAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
    ports:
      - "8080:8080"

  # Scrapes /actuator/prometheus (monitoring/prometheus/prometheus.yml). The
  # password is written to a file first, because Prometheus does not read
  # environment variables in its configuration.
  prometheus:
    image: prom/prometheus:v2.55.1
    environment:
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '%s' "$$METRICS_PASSWORD" > /tmp/metrics-password &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Dashboards for the application and the shop (monitoring/grafana), loaded
  # at start-up with Prometheus as the data source.
  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sales-and-stock.json
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  primary-data:
  replica-data:
  prometheus-data:
  grafana-data:
